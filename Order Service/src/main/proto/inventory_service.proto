syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.vanna.orders_serviceApp.grpc.inventory";
option java_outer_classname = "InventoryServiceProto";

package inventory;

service InventoryService {
  rpc CheckProductAvailability(CheckProductAvailabilityRequest) returns (CheckProductAvailabilityResponse);
  rpc CheckMultipleProductsAvailability(CheckMultipleProductsRequest) returns (CheckMultipleProductsResponse);
}

message CheckProductAvailabilityRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckProductAvailabilityResponse {
  bool available = 1;
  string message = 2;
  int32 actual_stock = 3;
  double price = 4;
  double sale = 5;
}

message ProductAvailabilityItem {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckMultipleProductsRequest {
  repeated ProductAvailabilityItem items = 1;
}

message ProductAvailabilityResult {
  string product_id = 1;
  bool available = 2;
  string message = 3;
  int32 actual_stock = 4;
  double price = 5;
  double sale = 6;
}

message CheckMultipleProductsResponse {
  repeated ProductAvailabilityResult results = 1;
}