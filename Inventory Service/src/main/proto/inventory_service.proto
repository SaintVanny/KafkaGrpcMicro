//todo check please
syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.vanna.inventory_serviceApp.grpc.inventory";
option java_outer_classname = "InventoryServiceProto";

package inventory;

service InventoryService {
  rpc CheckProductAvailability(CheckProductAvailabilityRequest) returns (CheckProductAvailabilityResponse);
}

message CheckProductAvailabilityRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckProductAvailabilityResponse {
  bool available = 1;
  string message = 2;
  int32 actual_stock = 3;
  double price = 4;
  double sale = 5;
}