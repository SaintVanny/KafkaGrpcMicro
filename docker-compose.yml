#   - PostgreSQL (orders_db, inventory_db)
#   - Order Service (REST API + JWT)
#   - Inventory Service (gRPC)

services:
  postgres:
    image: postgres:15-alpine
    container_name: pet2micro-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_MULTIPLE_DATABASES: orders_db,inventory_db

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  order-service:
    build:
      context: ./Order Service
      dockerfile: Dockerfile

    container_name: order-service
    restart: unless-stopped

    ports:
      - "${ORDER_SERVICE_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}

      GRPC_CLIENT_INVENTORY_SERVICE_ADDRESS: static://inventory-service:9090

      JWT_SECRET: ${JWT_SECRET:-my-256-bit-secret-key-change-this-in-production-please-make-it-long-enough-for-hs256}

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  inventory-service:
    build:
      context: ./Inventory Service
      dockerfile: Dockerfile

    container_name: inventory-service
    restart: unless-stopped

    ports:
      - "${INVENTORY_SERVICE_PORT:-8081}:8081"
      - "${GRPC_PORT:-9090}:9090"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}

      GRPC_SERVER_PORT: 9090

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
    name: pet2micro-postgres-data
