databaseChangeLog:
  - changeSet:
      id: 001-create-orders-table
      author: notification-service
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: sale
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: varchar(100)
              - column:
                  name: order_name
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(50)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_order_id
            tableName: orders
            columns:
              - column:
                  name: order_id

        - createIndex:
            indexName: idx_user_id
            tableName: orders
            columns:
              - column:
                  name: user_id