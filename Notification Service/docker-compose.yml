version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: notification-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: notifications_db
    ports:
      - "5433:5432"  
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d notifications_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  notification_postgres_data: